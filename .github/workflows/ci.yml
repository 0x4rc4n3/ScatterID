name: ScatterID CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test-sdk:
    name: SDK Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - run: npm test

  lint-and-test-verification-api:
    name: Verification API Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/verification-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: components/verification-api/package-lock.json
      - run: npm ci
      - run: npm test

  test-crypto-service:
    name: Crypto Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/crypto/crypto-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest --tb=short -q

  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker network create scatterid_net || true
      - run: docker compose build

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit SDK dependencies
        working-directory: sdk
        run: |
          npm ci
          npm audit --production --audit-level=high || true
      - name: Audit Verification API dependencies
        working-directory: components/verification-api
        run: |
          npm ci
          npm audit --production --audit-level=high || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit Python dependencies
        working-directory: components/crypto/crypto-service
        run: |
          pip install pip-audit
          pip install -r requirements.txt
          pip-audit || true
