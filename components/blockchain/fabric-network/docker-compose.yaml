version: '3.7'

volumes:
  orderer.scatterid.com:
  orderer2.scatterid.com:
  orderer3.scatterid.com:
  peer0.issuer.scatterid.com:
  peer1.issuer.scatterid.com:
  peer0.verifier.scatterid.com:
  peer1.verifier.scatterid.com:

networks:
  scatterid_net:
    name: scatterid_net

services:
  # ────────────────────────────────────────────────────────────────────────────
  # 3-Node Raft Orderer Cluster (High Availability / Fault Tolerant)
  # ────────────────────────────────────────────────────────────────────────────
  orderer.scatterid.com:
    container_name: orderer.scatterid.com
    image: hyperledger/fabric-orderer:2.5.9
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_OPERATIONS_LISTENADDRESS=orderer.scatterid.com:9443
      - ORDERER_METRICS_PROVIDER=prometheus
    working_dir: /root
    command: orderer
    volumes:
      - ./organizations/ordererOrganizations/scatterid.com/orderers/orderer.scatterid.com/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/scatterid.com/orderers/orderer.scatterid.com/tls/:/var/hyperledger/orderer/tls
      - orderer.scatterid.com:/var/hyperledger/production/orderer
    ports:
      - 7050:7050
      - 7053:7053
      - 9443:9443
    networks:
      - scatterid_net

  orderer2.scatterid.com:
    container_name: orderer2.scatterid.com
    image: hyperledger/fabric-orderer:2.5.9
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_OPERATIONS_LISTENADDRESS=orderer2.scatterid.com:9447
      - ORDERER_METRICS_PROVIDER=prometheus
    working_dir: /root
    command: orderer
    volumes:
      - ./organizations/ordererOrganizations/scatterid.com/orderers/orderer2.scatterid.com/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/scatterid.com/orderers/orderer2.scatterid.com/tls/:/var/hyperledger/orderer/tls
      - orderer2.scatterid.com:/var/hyperledger/production/orderer
    ports:
      - 7054:7050
      - 7057:7053
      - 9447:9447
    networks:
      - scatterid_net

  orderer3.scatterid.com:
    container_name: orderer3.scatterid.com
    image: hyperledger/fabric-orderer:2.5.9
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_OPERATIONS_LISTENADDRESS=orderer3.scatterid.com:9448
      - ORDERER_METRICS_PROVIDER=prometheus
    working_dir: /root
    command: orderer
    volumes:
      - ./organizations/ordererOrganizations/scatterid.com/orderers/orderer3.scatterid.com/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/scatterid.com/orderers/orderer3.scatterid.com/tls/:/var/hyperledger/orderer/tls
      - orderer3.scatterid.com:/var/hyperledger/production/orderer
    ports:
      - 7055:7050
      - 7058:7053
      - 9448:9448
    networks:
      - scatterid_net

  # ────────────────────────────────────────────────────────────────────────────
  # Issuer Organization Redundant Peers (peer0 and peer1)
  # ────────────────────────────────────────────────────────────────────────────
  peer0.issuer.scatterid.com:
    container_name: peer0.issuer.scatterid.com
    image: hyperledger/fabric-peer:2.5.9
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.issuer.scatterid.com
      - CORE_PEER_ADDRESS=peer0.issuer.scatterid.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.issuer.scatterid.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1.issuer.scatterid.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.issuer.scatterid.com:7051
      - CORE_PEER_LOCALMSPID=IssuerMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.issuer.scatterid.com:9444
      - CORE_METRICS_PROVIDER=prometheus
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=scatterid_net
    volumes:
      - ./config:/etc/hyperledger/peercfg
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/issuer.scatterid.com/peers/peer0.issuer.scatterid.com:/etc/hyperledger/fabric
      - peer0.issuer.scatterid.com:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - 7051:7051
      - 9444:9444
    networks:
      - scatterid_net

  peer1.issuer.scatterid.com:
    container_name: peer1.issuer.scatterid.com
    image: hyperledger/fabric-peer:2.5.9
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer1.issuer.scatterid.com
      - CORE_PEER_ADDRESS=peer1.issuer.scatterid.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer1.issuer.scatterid.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.issuer.scatterid.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.issuer.scatterid.com:7051
      - CORE_PEER_LOCALMSPID=IssuerMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer1.issuer.scatterid.com:9446
      - CORE_METRICS_PROVIDER=prometheus
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=scatterid_net
    volumes:
      - ./config:/etc/hyperledger/peercfg
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/issuer.scatterid.com/peers/peer1.issuer.scatterid.com:/etc/hyperledger/fabric
      - peer1.issuer.scatterid.com:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - 7056:7051
      - 9446:9446
    networks:
      - scatterid_net

  # ────────────────────────────────────────────────────────────────────────────
  # Verifier Organization Redundant Peers (peer0 and peer1)
  # ────────────────────────────────────────────────────────────────────────────
  peer0.verifier.scatterid.com:
    container_name: peer0.verifier.scatterid.com
    image: hyperledger/fabric-peer:2.5.9
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.verifier.scatterid.com
      - CORE_PEER_ADDRESS=peer0.verifier.scatterid.com:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.verifier.scatterid.com:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1.verifier.scatterid.com:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.verifier.scatterid.com:8051
      - CORE_PEER_LOCALMSPID=VerifierMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.verifier.scatterid.com:9445
      - CORE_METRICS_PROVIDER=prometheus
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=scatterid_net
    volumes:
      - ./config:/etc/hyperledger/peercfg
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/verifier.scatterid.com/peers/peer0.verifier.scatterid.com:/etc/hyperledger/fabric
      - peer0.verifier.scatterid.com:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - 8051:8051
      - 9445:9445
    networks:
      - scatterid_net

  peer1.verifier.scatterid.com:
    container_name: peer1.verifier.scatterid.com
    image: hyperledger/fabric-peer:2.5.9
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer1.verifier.scatterid.com
      - CORE_PEER_ADDRESS=peer1.verifier.scatterid.com:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer1.verifier.scatterid.com:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.verifier.scatterid.com:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.verifier.scatterid.com:8051
      - CORE_PEER_LOCALMSPID=VerifierMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer1.verifier.scatterid.com:9449
      - CORE_METRICS_PROVIDER=prometheus
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=scatterid_net
    volumes:
      - ./config:/etc/hyperledger/peercfg
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/verifier.scatterid.com/peers/peer1.verifier.scatterid.com:/etc/hyperledger/fabric
      - peer1.verifier.scatterid.com:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - 8056:8051
      - 9449:9449
    networks:
      - scatterid_net

  # ────────────────────────────────────────────────────────────────────────────
  # HashiCorp Vault Key Management Service (KMS)
  # ────────────────────────────────────────────────────────────────────────────
  vault:
    container_name: vault.scatterid.com
    image: hashicorp/vault:1.15.2
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_TOKEN}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    ports:
      - 8200:8200
    cap_add:
      - IPC_LOCK
    networks:
      - scatterid_net
