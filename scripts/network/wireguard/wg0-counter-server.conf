# ==============================================================================
# ScatterID — WireGuard Server Configuration (Zone 1: Counter / Staff VPN)
# Document ID: SEC-NET-07
# ==============================================================================
# Interface: wg0
# Subnet: 10.20.0.0/24
# Intended for: Help Desk Clerks, Frontline Identity Intake Stations
# Access: Restricted strictly to Client Portal (:5000). Blocked from :8080, :3000, :5001.
# ==============================================================================

[Interface]
Address = 10.20.0.1/24
ListenPort = 51820
PrivateKey = SERVER_ZONE1_PRIVATE_KEY_REPLACE_ME

# PostUp: Enforce microsegmentation rules upon interface activation
PostUp = iptables -A FORWARD -i wg0 -o wg0 -j REJECT --reject-with icmp-admin-prohibited
PostUp = iptables -A FORWARD -i wg0 -d 10.10.0.0/24 -j DROP
PostDown = iptables -D FORWARD -i wg0 -o wg0 -j REJECT --reject-with icmp-admin-prohibited || true
PostDown = iptables -D FORWARD -i wg0 -d 10.10.0.0/24 -j DROP || true

# ------------------------------------------------------------------------------
# Peer: Help Desk Intake Station 01
# ------------------------------------------------------------------------------
[Peer]
PublicKey = CLERK_STATION_01_PUBLIC_KEY_REPLACE_ME
AllowedIPs = 10.20.0.2/32

# ------------------------------------------------------------------------------
# Peer: Help Desk Intake Station 02
# ------------------------------------------------------------------------------
[Peer]
PublicKey = CLERK_STATION_02_PUBLIC_KEY_REPLACE_ME
AllowedIPs = 10.20.0.3/32
