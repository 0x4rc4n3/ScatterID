# ==============================================================================
# ScatterID — WireGuard Server Configuration (Zone 2: Management Ops)
# Document ID: SEC-NET-07
# ==============================================================================
# Interface: wg1
# Subnet: 10.10.0.0/24
# Intended for: Moderators (Mod), Root Administrators (Root), SecOps
# Access: Permitted to Ops Dashboard (:8080) and Verification Gateway API (:3000)
# ==============================================================================

[Interface]
Address = 10.10.0.1/24
ListenPort = 51821
PrivateKey = SERVER_ZONE2_PRIVATE_KEY_REPLACE_ME

# PostUp: Strict firewall isolation protecting management plane
PostUp = iptables -A INPUT -i wg1 -p tcp --dport 8080 -j ACCEPT
PostUp = iptables -A INPUT -i wg1 -p tcp --dport 3000 -j ACCEPT
PostDown = iptables -D INPUT -i wg1 -p tcp --dport 8080 -j ACCEPT || true
PostDown = iptables -D INPUT -i wg1 -p tcp --dport 3000 -j ACCEPT || true

# ------------------------------------------------------------------------------
# Peer: Root Admin Workstation 01
# ------------------------------------------------------------------------------
[Peer]
PublicKey = ROOT_ADMIN_01_PUBLIC_KEY_REPLACE_ME
AllowedIPs = 10.10.0.2/32

# ------------------------------------------------------------------------------
# Peer: Moderator Workstation 01
# ------------------------------------------------------------------------------
[Peer]
PublicKey = MOD_WORKSTATION_01_PUBLIC_KEY_REPLACE_ME
AllowedIPs = 10.10.0.3/32
