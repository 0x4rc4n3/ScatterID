services:
  crypto-service:
    build:
      context: ./components/crypto/crypto-service
      dockerfile: Dockerfile
    container_name: scatterid-crypto
    ports:
      - "${PORT_CRYPTO_SERVICE:-5001}:5001"
    environment:
      VAULT_ADDR: "${VAULT_ADDR:-http://vault.scatterid.com:8200}"
      VAULT_TOKEN: "${VAULT_TOKEN}"
      VAULT_ROLE_ID: "${VAULT_ROLE_ID:-}"
      VAULT_SECRET_ID: "${VAULT_SECRET_ID:-}"
      VAULT_SECRET_PATH: "${VAULT_SECRET_PATH:-scatterid/mldsa}"
      CRYPTO_SERVICE_API_KEY: "${CRYPTO_SERVICE_API_KEY}"
      # Local dev only — allows HTTP connection to Vault. Must be explicitly set to true.
      VAULT_DEV_MODE: "${VAULT_DEV_MODE:-false}"
    volumes:
      - ./components/crypto/certs:/app/certs
      - ./components/crypto/crypto-service:/app
    networks:
      - scatterid_net

  verification-api:
    build:
      context: ./components/verification-api
      dockerfile: Dockerfile
    container_name: scatterid-verification
    ports:
      - "${PORT_VERIFICATION_API:-3000}:3000"
    environment:
      CRYPTO_SERVICE_API_KEY: "${CRYPTO_SERVICE_API_KEY}"
      CRYPTO_SERVICE_URL: "${CRYPTO_SERVICE_URL:-https://crypto-service:5001}"
      # Inbound auth key for the verification-api itself (required — service refuses to start without it).
      VERIFICATION_API_KEY: "${VERIFICATION_API_KEY}"
      # Dedicated administrative revocation key (required — service refuses to start without it or if equal to VERIFICATION_API_KEY).
      REVOKE_API_KEY: "${REVOKE_API_KEY}"
      SQLITE_DB_PATH: "${SQLITE_DB_PATH:-/app/data/credentials.db}"
      # Trust the crypto-service's CA certificate for TLS validation.
      NODE_EXTRA_CA_CERTS: "${NODE_EXTRA_CA_CERTS:-/app/certs/ca.crt}"
    depends_on:
      - crypto-service
    volumes:
      - ./components/crypto/certs:/app/certs
      - ./components/blockchain:/app/blockchain
      - ./components/verification-api/src:/app/src
      - verification_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - scatterid_net

networks:
  scatterid_net:
    name: scatterid_net
    external: true

volumes:
  verification_data:
