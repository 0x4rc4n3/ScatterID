services:
  crypto-service:
    build:
      context: ./components/crypto/crypto-service
      dockerfile: Dockerfile
    container_name: scatterid-crypto
    ports:
      - "${PORT_CRYPTO_SERVICE:-5001}:5001"
    environment:
      VAULT_ADDR: "http://vault.scatterid.com:8200"
      VAULT_TOKEN: "${VAULT_TOKEN}"
      VAULT_ROLE_ID: "${VAULT_ROLE_ID:-}"
      VAULT_SECRET_ID: "${VAULT_SECRET_ID:-}"
      VAULT_SECRET_PATH: "${VAULT_SECRET_PATH:-scatterid/mldsa}"
      CRYPTO_SERVICE_API_KEY: "${CRYPTO_SERVICE_API_KEY}"
      # Local dev only — allows HTTP connection to Vault. Remove for production.
      VAULT_DEV_MODE: "true"
    volumes:
      - ./components/crypto/certs:/app/certs
      - ./components/crypto/crypto-service:/app
      - ./config.json:/app/config.json:ro
    networks:
      - scatterid_net

  verification-api:
    build:
      context: ./components/verification-api
      dockerfile: Dockerfile
    container_name: scatterid-verification
    ports:
      - "${PORT_VERIFICATION_API:-3000}:3000"
    environment:
      CRYPTO_SERVICE_API_KEY: "${CRYPTO_SERVICE_API_KEY}"
      CRYPTO_SERVICE_URL: "https://crypto-service:5001"
      # Inbound auth key for the verification-api itself (required — service refuses to start without it).
      VERIFICATION_API_KEY: "${VERIFICATION_API_KEY}"
      SQLITE_DB_PATH: "/app/data/credentials.db"
      # Trust the crypto-service's CA certificate for TLS validation.
      # The CA is generated by generate_certs.sh and mounted from ./components/crypto/certs.
      NODE_EXTRA_CA_CERTS: "/app/certs/ca.crt"
    depends_on:
      - crypto-service
    volumes:
      - ./components/crypto/certs:/app/certs
      - ./components/blockchain:/app/blockchain
      - ./components/verification-api/src:/app/src
      - verification_data:/app/data
      - ./config.json:/app/config.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - scatterid_net

  project-dashboard:
    build:
      context: ./components/project-dashboard
      dockerfile: Dockerfile
    container_name: scatterid-dashboard
    ports:
      - "${PORT_DASHBOARD:-4000}:4000"
    environment:
      VERIFICATION_API_URL: "http://verification-api:3000"
      GATEWAY_API_KEY: "${GATEWAY_API_KEY}"
      # Auth key the dashboard uses when proxying requests to verification-api.
      VERIFICATION_API_KEY: "${VERIFICATION_API_KEY}"
    volumes:
      - ./Progress.md:/app/Progress.md
      - ./components/project-dashboard/public:/app/public
      - ./components/project-dashboard/server.js:/app/server.js
      - ./components/project-dashboard/config.js:/app/config.js
      - ./components/verification-api:/app/verification-api
      - verification_data:/app/data:ro
      - ./config.json:/app/config.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - scatterid_net

networks:
  scatterid_net:
    name: scatterid_net
    external: true

volumes:
  verification_data:
