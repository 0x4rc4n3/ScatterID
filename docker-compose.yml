# ScatterID Ecosystem — Master 3-Zone Microsegmented Topology
# Enforces Zero Trust Network Segmentation across:
#   - Zone 1: Counter Subnet (10.20.0.0/24) -> Client Portal (:5000)
#   - Zone 2: Management Subnet (10.10.0.0/24) -> Operations Console (:8080)
#   - Zone 3: Core Dataplane Subnet (10.30.0.0/24) -> Verification API, Crypto Service, Vault KMS

services:
  crypto-service:
    build:
      context: ./components/crypto/crypto-service
      dockerfile: Dockerfile
    container_name: scatterid-crypto
    ports:
      - "${PORT_CRYPTO_SERVICE:-5001}:5001"
    environment:
      VAULT_ADDR: "${VAULT_ADDR:-http://vault.scatterid.com:8200}"
      VAULT_TOKEN: "${VAULT_TOKEN:-}"
      VAULT_ROLE_ID: "${VAULT_ROLE_ID:-}"
      VAULT_SECRET_ID: "${VAULT_SECRET_ID:-}"
      VAULT_SECRET_PATH: "${VAULT_SECRET_PATH:-scatterid/mldsa}"
      CRYPTO_SERVICE_API_KEY: "${CRYPTO_SERVICE_API_KEY}"
      # Local dev only — allows HTTP connection to Vault. Must be explicitly set to true.
      VAULT_DEV_MODE: "${VAULT_DEV_MODE:-false}"
    volumes:
      - ./components/crypto/certs:/app/certs
      - ./components/crypto/crypto-service:/app
    networks:
      zone3_dataplane_net:
        ipv4_address: 10.30.0.10

  verification-api:
    build:
      context: ./components/verification-api
      dockerfile: Dockerfile
    container_name: scatterid-verification
    ports:
      - "${PORT_VERIFICATION_API:-3000}:3000"
    environment:
      CRYPTO_SERVICE_API_KEY: "${CRYPTO_SERVICE_API_KEY}"
      CRYPTO_SERVICE_URL: "${CRYPTO_SERVICE_URL:-https://crypto-service:5001}"
      # Inbound auth key for the verification-api itself (required — service refuses to start without it).
      VERIFICATION_API_KEY: "${VERIFICATION_API_KEY}"
      # Dedicated administrative revocation key (required — service refuses to start without it or if equal to VERIFICATION_API_KEY).
      REVOKE_API_KEY: "${REVOKE_API_KEY}"
      SQLITE_DB_PATH: "${SQLITE_DB_PATH:-/app/data/credentials.db}"
      # Trust the crypto-service's CA certificate for TLS validation.
      NODE_EXTRA_CA_CERTS: "${NODE_EXTRA_CA_CERTS:-/app/certs/ca.crt}"
    depends_on:
      - crypto-service
    volumes:
      - ./components/crypto/certs:/app/certs
      - ./components/blockchain:/app/blockchain
      - ./components/verification-api/src:/app/src
      - verification_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      zone3_dataplane_net:
        ipv4_address: 10.30.0.11

  ops-dashboard:
    build:
      context: ./components/ops-dashboard
      dockerfile: Dockerfile
    container_name: scatterid-ops-dashboard
    ports:
      - "${PORT_OPS_DASHBOARD:-8080}:8080"
    environment:
      PORT: 8080
      JWT_SECRET: "${JWT_SECRET}"
      RECOVERY_CODE_PEPPER: "${RECOVERY_CODE_PEPPER:-}"
      SQLITE_DB_PATH: "/app/data/ops.db"
      VERIFICATION_API_URL: "http://verification-api:3000"
    depends_on:
      - verification-api
    volumes:
      - ops_data:/app/data
    networks:
      zone2_mgmt_net:
        ipv4_address: 10.10.0.10
      zone3_dataplane_net:
        ipv4_address: 10.30.0.12

  client-portal:
    build:
      context: ../ScatterID-app
      dockerfile: Dockerfile
    container_name: scatterid-client-portal
    ports:
      - "${PORT_CLIENT_PORTAL:-5000}:5000"
    environment:
      PORT: 5000
      GATEWAY_URL: "http://verification-api:3000"
      OPS_DASHBOARD_URL: "http://ops-dashboard:8080"
      VERIFICATION_API_KEY: "${VERIFICATION_API_KEY:-}"
    depends_on:
      - verification-api
      - ops-dashboard
    networks:
      zone1_counter_net:
        ipv4_address: 10.20.0.10
      zone3_dataplane_net:
        ipv4_address: 10.30.0.13

networks:
  zone1_counter_net:
    name: scatterid_zone1_counter
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.20.0.0/24
          gateway: 10.20.0.1

  zone2_mgmt_net:
    name: scatterid_zone2_mgmt
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.10.0.0/24
          gateway: 10.10.0.1

  zone3_dataplane_net:
    name: scatterid_zone3_dataplane
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.30.0.0/24
          gateway: 10.30.0.1

volumes:
  verification_data:
  ops_data:
